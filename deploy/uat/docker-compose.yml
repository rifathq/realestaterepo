# UAT: https://uat.digents.com/masud  (Masud Haque agent site)
# Same shape as the other uat.digents.com slugs: Traefik path router, stripprefix,
# cfdns certificate, joined to n8n_default, no host port published.
# Public (no basic auth since 2026-10-01). The demo logins are locked at startup:
# the admin password comes from /home/ubuntu/masud-site-uat/uat.env (never in git)
# and every other demo account gets a random password. Marked noindex.
name: masud-site-uat

services:
  masud-site-uat:
    build:
      context: ../..
      dockerfile: deploy/uat/Dockerfile
      args:
        APP_BASE: /masud/
    container_name: masud-site-uat
    restart: unless-stopped
    environment:
      AGENT_SITE_URL: https://uat.digents.com/masud
      ADMIN_EMAIL: ${UAT_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${UAT_ADMIN_PASSWORD}
    mem_limit: 384m
    cpus: 0.5
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.masud-site-uat.rule=Host(`uat.digents.com`) && (Path(`/masud`) || PathPrefix(`/masud/`))"
      - "traefik.http.routers.masud-site-uat.entrypoints=web,websecure"
      - "traefik.http.routers.masud-site-uat.tls=true"
      - "traefik.http.routers.masud-site-uat.tls.certresolver=cfdns"
      - "traefik.http.routers.masud-site-uat.middlewares=masud-site-uat-noindex,masud-site-uat-strip"
      - "traefik.http.middlewares.masud-site-uat-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow"
      - "traefik.http.middlewares.masud-site-uat-strip.stripprefix.prefixes=/masud"
      - "traefik.http.services.masud-site-uat.loadbalancer.server.port=8080"

networks:
  n8n_default:
    external: true
