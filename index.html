    <!-- Defensive polyfill: Ensure window.fetch has both getter and setter in iframe environments -->
    <script>
      (function() {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var _pFetch = Window.prototype.fetch || window.fetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return _pFetch;
                },
                set: function(val) {
                  _pFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (_) {}
        }
      })();
    </script>
